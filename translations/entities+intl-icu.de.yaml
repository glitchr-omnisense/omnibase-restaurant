# The names of omnibase/restaurant's entities, which omnibase/admin titles its screens with
# (de of /admin/meal-services, /admin/reservations...).
restaurant:
  meal_service:
    _singular: "Service"
    _plural: "Services"
  reservation:
    _singular: "Reservierung"
    _plural: "Reservierungen"
  room:
    _singular: "Raum"
    _plural: "Räume"
  table:
    _singular: "Tisch"
    _plural: "Tische"
  layout:
    _singular: "Raumplan"
    _plural: "Raumpläne"
  menu:
    dish:
      _singular: "Gericht"
      _plural: "Gerichte"
    menu_section:
